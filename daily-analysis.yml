name: 한국 증시 AI 분석

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 분석 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python analyze.py
      - name: 커밋
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "KRMarketAI Bot"
          git add docs/
          git diff --staged --quiet || git commit -m "증시 분석 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d')"
          git push
